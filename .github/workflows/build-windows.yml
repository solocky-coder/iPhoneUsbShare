name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Verify Apple driver files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('netaapl64.inf','netaapl64.sys','netaapl64.cat','WdfCoInstaller01009.dll')) {
            $p = Join-Path 'NetDrivers' $f
            if (-not (Test-Path $p)) { throw "Missing NetDrivers file: $p" }
            Write-Host "$p : $((Get-Item $p).Length) bytes"
          }

      - name: Add Apple Ethernet activation hook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src\ShareEngine.cs'
          $text = Get-Content $path -Raw
          $nl = [Environment]::NewLine
          $old = '            // Windows 10 has no inbox UsbNcm.sys.'
          if (-not $text.Contains($old)) { throw 'Windows 10 Ethernet comment anchor not found.' }
          $replacement = @(
            '            // The iPad descriptor dump shows CDC-NCM in configuration 5.',
            '            // Usbccgp owns configuration selection for composite devices, so configure it to select 5 before restart.',
            '            ConfigureAppleCompositeConfiguration(5, 2);',
            '            WriteLog("Activating Apple USB configuration 5 for CDC-NCM networking…");',
            '            if (!await UsbNative.SetConfigurationAsync(5))',
            '                throw new InvalidOperationException("The iPad exposed CDC-NCM configuration 5, but USB configuration 5 could not be activated.");',
            '            await Task.Delay(1500);',
            '            InstallBundledAppleEthernetDriver();',
            '            RescanAppleNetworkingInterfaces();',
            '            await Task.Delay(2000);',
            '',
            $old
          ) -join $nl
          $text = $text.Replace($old, $replacement, 1)

          $method = @(
            '',
            '    private void ConfigureAppleCompositeConfiguration(uint original, uint alternate)',
            '    {',
            '        try',
            '        {',
            '            var parent = FindPnP("VID_05AC&PID_12AB", null).FirstOrDefault(d => !d.Id.Contains("&MI_", StringComparison.OrdinalIgnoreCase));',
            '            if (parent is null)',
            '                throw new InvalidOperationException("Apple composite parent devnode was not found.");',
            '            var keyPath = $@"SYSTEM\\CurrentControlSet\\Enum\\{parent.Id}";',
            '            using var key = Registry.LocalMachine.OpenSubKey(keyPath, writable: true) ?? throw new InvalidOperationException("Cannot open Apple composite hardware registry key.");',
            '            key.SetValue("OriginalConfigurationValue", original, RegistryValueKind.DWord);',
            '            key.SetValue("AltConfigurationValue", alternate, RegistryValueKind.DWord);',
            '            WriteLog($"Usbccgp configuration policy: parent={parent.Id}, OriginalConfigurationValue={original}, AltConfigurationValue={alternate}");',
            '        }',
            '        catch (Exception ex)',
            '        {',
            '            WriteLog($"Usbccgp configuration policy failed: {ex.Message}");',
            '            throw;',
            '        }',
            '    }',
            '',
            '    private void InstallBundledAppleEthernetDriver()',
            '    {',
            '        var inf = Path.Combine(AppDir, "netaapl64.inf");',
            '        var cat = Path.Combine(AppDir, "netaapl64.cat");',
            '        var sys = Path.Combine(AppDir, "netaapl64.sys");',
            '        if (!File.Exists(inf) || !File.Exists(cat) || !File.Exists(sys))',
            '            throw new InvalidOperationException("The bundled Apple Mobile Device Ethernet driver files are missing.");',
            '        WriteLog("Installing bundled Apple Mobile Device Ethernet driver netaapl64 1.8.5.1…");',
            '        var r = RunAllowRestart("pnputil.exe", $"/add-driver {(char)34}{inf}{(char)34} /install");',
            '        WriteLog($"Apple Ethernet driver PnPUtil exit code: {r.ExitCode}");',
            '        if (!string.IsNullOrWhiteSpace(r.Output)) WriteLog($"Apple Ethernet driver PnPUtil output: {r.Output.Trim()}");',
            '        if (!string.IsNullOrWhiteSpace(r.Error)) WriteLog($"Apple Ethernet driver PnPUtil error: {r.Error.Trim()}");',
            '        if (r.ExitCode != 0 && r.ExitCode != 3010) throw new InvalidOperationException($"Apple Ethernet driver installation failed ({r.ExitCode}): {r.Error}");',
            '    }',
            '',
            '    [DllImport("CfgMgr32.dll", CharSet = CharSet.Unicode)]',
            '    private static extern uint CM_Locate_DevNodeW(out uint pdnDevInst, string pDeviceID, uint ulFlags);',
            '    [DllImport("CfgMgr32.dll")]',
            '    private static extern uint CM_Get_Parent(out uint pdnDevInst, uint dnDevInst, uint ulFlags);',
            '    [DllImport("CfgMgr32.dll")]',
            '    private static extern uint CM_Reenumerate_DevNode(uint dnDevInst, uint ulFlags);',
            '',
            '    private void RescanAppleNetworkingInterfaces()',
            '    {',
            '        WriteLog("Forcing usbccgp composite re-enumeration for Apple networking interfaces…");',
            '        try',
            '        {',
            '            var child = FindPnP("VID_05AC&PID_12AB", null).FirstOrDefault(d => d.Id.Contains("&MI_01\\", StringComparison.OrdinalIgnoreCase));',
            '            if (child is null) child = FindPnP("VID_05AC&PID_12AB", null).FirstOrDefault(d => !d.Id.Contains("&MI_", StringComparison.OrdinalIgnoreCase));',
            '            if (child is null)',
            '            {',
            '                WriteLog("Could not locate an Apple PID 12AB child devnode for CM_Reenumerate_DevNode.");',
            '            }',
            '            else',
            '            {',
            '                var locate = CM_Locate_DevNodeW(out var childDevInst, child.Id, 0);',
            '                WriteLog($"CM_Locate_DevNodeW({child.Id}) = {locate}");',
            '                if (locate == 0)',
            '                {',
            '                    var parentResult = CM_Get_Parent(out var parentDevInst, childDevInst, 0);',
            '                    WriteLog($"CM_Get_Parent = {parentResult}");',
            '                    if (parentResult == 0)',
            '                    {',
            '                        var reenum = CM_Reenumerate_DevNode(parentDevInst, 0x00000001);',
            '                        WriteLog($"CM_Reenumerate_DevNode(parent, SYNCHRONOUS) = {reenum}");',
            '                    }',
            '                }',
            '            }',
            '        }',
            '        catch (Exception ex) { WriteLog($"CM composite re-enumeration failed: {ex.Message}"); }',
            '',
            '        var scan = RunAllowRestart("pnputil.exe", "/scan-devices");',
            '        WriteLog($"PNPUTIL scan exit code: {scan.ExitCode}");',
            '        if (!string.IsNullOrWhiteSpace(scan.Output)) WriteLog($"PNPUTIL scan output: {scan.Output.Trim()}");',
            '        if (!string.IsNullOrWhiteSpace(scan.Error)) WriteLog($"PNPUTIL scan error: {scan.Error.Trim()}");',
            '        try',
            '        {',
            '            var apple = FindPnP("VID_05AC&PID_12AB", null).ToList();',
            '            if (apple.Count == 0) WriteLog("Apple PID 12AB PnP enumeration: no matching interfaces found after composite re-enumeration.");',
            '            foreach (var d in apple)',
            '            {',
            '                WriteLog($"Apple interface: {d.Id} | {d.Name}");',
            '                var drivers = RunAllowRestart("pnputil.exe", $"/enum-devices /instanceid {(char)34}{d.Id}{(char)34} /drivers");',
            '                WriteLog($"  PnP driver query exit code: {drivers.ExitCode}");',
            '                if (!string.IsNullOrWhiteSpace(drivers.Output)) WriteLog($"  PnP driver query: {drivers.Output.Trim().Replace(Environment.NewLine, " | ")}");',
            '                if (!string.IsNullOrWhiteSpace(drivers.Error)) WriteLog($"  PnP driver query error: {drivers.Error.Trim().Replace(Environment.NewLine, " | ")}");',
            '            }',
            '        }',
            '        catch (Exception ex) { WriteLog($"Apple networking PnP enumeration failed: {ex.Message}"); }',
            '    }',
            ''
          ) -join $nl
          $anchor = '    private void ConfigureUsbDevice(PnpDevice phone)'
          if (-not $text.Contains($anchor)) { throw 'ConfigureUsbDevice anchor not found.' }
          $text = $text.Replace($anchor, $method + $anchor, 1)
          if (-not $text.Contains('using System.Runtime.InteropServices;')) {
            $text = $text.Replace('using System.Net.Http;' + $nl, 'using System.Net.Http;' + $nl + 'using System.Runtime.InteropServices;' + $nl, 1)
          }
          Set-Content -Path $path -Value $text -Encoding utf8 -NoNewline
          Write-Host 'Apple usbccgp configuration policy and composite re-enumeration hook inserted.'

      - name: Publish EXE
        shell: pwsh
        run: |
          dotnet restore .\src\iPhoneUsbShare.csproj
          dotnet publish .\src\iPhoneUsbShare.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o .\artifacts\publish

      - name: Download official libusb-win32 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.2/libusb-win32-bin-1.4.0.2.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'libusb-win32.zip'
          $expected = '00004c92cdb99be36e17fb2377165eb97e63b48ba895bfc04a642ea9c3e26d94'
          Invoke-WebRequest -Uri $url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'libusb-win32 SHA-256 mismatch.' }
          $extract = Join-Path $env:RUNNER_TEMP 'libusb-win32'
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $dll = Join-Path $extract 'libusb-win32-bin-1.4.0.2\bin\amd64\libusb0.dll'
          if (-not (Test-Path $dll)) { throw 'x64 libusb0.dll not found.' }
          New-Item -ItemType Directory -Force .\artifacts\package | Out-Null
          Copy-Item $dll .\artifacts\package\libusb0.dll -Force

      - name: Package ready-to-run ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = '.\artifacts\package'
          Copy-Item .\artifacts\publish\iPhoneUsbShare.exe $package\iPhoneUsbShare.exe -Force
          Copy-Item .\README.md $package\README.txt -Force
          foreach ($f in @('netaapl64.inf','netaapl64.sys','netaapl64.cat','WdfCoInstaller01009.dll')) {
            Copy-Item (Join-Path 'NetDrivers' $f) (Join-Path $package $f) -Force
          }
          Set-Content (Join-Path $package 'THIRD_PARTY_NOTICES.txt') 'libusb-win32 1.4.0.2`r`nApple Mobile Device Ethernet driver files from NetDrivers'
          Compress-Archive -Path "$package\*" -DestinationPath .\artifacts\iPhoneUsbShare-win-x64.zip -Force
          Get-Item .\artifacts\iPhoneUsbShare-win-x64.zip | Select-Object FullName,Length

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneUsbShare-win-x64
          path: artifacts/iPhoneUsbShare-win-x64.zip
          if-no-files-found: error
          retention-days: 14
