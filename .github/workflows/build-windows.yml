name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Verify bundled Apple Ethernet driver files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'NetDrivers\netaapl64.inf',
            'NetDrivers\netaapl64.sys',
            'NetDrivers\netaapl64.cat',
            'NetDrivers\WdfCoInstaller01009.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing bundled Apple driver file: $file" }
            Write-Host "$file : $((Get-Item $file).Length) bytes"
          }

      - name: Enable bundled Apple Ethernet driver installation in app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src\ShareEngine.cs'
          $text = Get-Content $path -Raw
          $nl = [Environment]::NewLine
          $needle = "        await EnsurePrerequisitesAsync();$nl"
          if (-not $text.Contains($needle)) { throw 'Could not find StartAsync prerequisite call.' }
          $replacement = "        await EnsurePrerequisitesAsync();$nl        InstallBundledAppleEthernetDriver();$nl"
          $text = $text.Replace($needle, $replacement)
          $method = @'

    private void InstallBundledAppleEthernetDriver()
    {
        var inf = Path.Combine(AppDir, "netaapl64.inf");
        var sys = Path.Combine(AppDir, "netaapl64.sys");
        var cat = Path.Combine(AppDir, "netaapl64.cat");
        var wdf = Path.Combine(AppDir, "WdfCoInstaller01009.dll");
        if (!File.Exists(inf) || !File.Exists(sys) || !File.Exists(cat) || !File.Exists(wdf))
        {
            WriteLog("Apple Ethernet driver package is not beside the EXE; continuing without it.");
            return;
        }

        WriteLog("Installing/staging bundled Apple Mobile Device Ethernet driver…");
        var result = RunAllowRestart("pnputil.exe", $"/add-driver \"{inf}\" /install");
        WriteLog($"Apple Ethernet driver pnputil exit code: {result.ExitCode}");
        if (!string.IsNullOrWhiteSpace(result.Output)) WriteLog($"Apple Ethernet driver output: {result.Output.Trim()}");
        if (!string.IsNullOrWhiteSpace(result.Error)) WriteLog($"Apple Ethernet driver error: {result.Error.Trim()}");
        if (result.ExitCode != 0 && result.ExitCode != 3010)
            throw new InvalidOperationException($"Apple Ethernet driver installation failed ({result.ExitCode}): {result.Error}");
    }
'@
          $anchor = '    private void ConfigureUsbDevice(PnpDevice phone)'
          if (-not $text.Contains($anchor)) { throw 'Could not find ConfigureUsbDevice insertion point.' }
          $text = $text.Replace($anchor, $method + $nl + $anchor)
          Set-Content -Path $path -Value $text -Encoding utf8 -NoNewline
          Write-Host 'Apple Ethernet driver installation hook added to build.'

      - name: Publish self-contained EXE
        shell: pwsh
        run: |
          dotnet restore .\src\iPhoneUsbShare.csproj
          dotnet publish .\src\iPhoneUsbShare.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o .\artifacts\publish

      - name: Prepare libusb-win32 runtime DLL
        shell: pwsh
        run: |
          $url = "https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.2/libusb-win32-bin-1.4.0.2.zip"
          $zip = Join-Path $env:RUNNER_TEMP "libusb-win32-bin-1.4.0.2.zip"
          $expected = "00004c92cdb99be36e17fb2377165eb97e63b48ba895bfc04a642ea9c3e26d94"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "libusb-win32 SHA-256 mismatch." }
          $extract = Join-Path $env:RUNNER_TEMP "libusb-win32"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $dll = Join-Path $extract "libusb-win32-bin-1.4.0.2\bin\amd64\libusb0.dll"
          if (-not (Test-Path $dll)) { throw "x64 libusb0.dll not found." }
          New-Item -ItemType Directory -Force .\artifacts\package | Out-Null
          Copy-Item $dll .\artifacts\package\libusb0.dll -Force

      - name: Package Apple Ethernet driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = '.\artifacts\package'
          foreach ($name in @('netaapl64.inf','netaapl64.sys','netaapl64.cat','WdfCoInstaller01009.dll')) {
            Copy-Item (Join-Path 'NetDrivers' $name) (Join-Path $package $name) -Force
          }
          Write-Host 'Bundled Apple Ethernet driver files:'
          Get-ChildItem $package | Select-Object Name,Length

      - name: Create user package
        shell: pwsh
        run: |
          Copy-Item .\artifacts\publish\iPhoneUsbShare.exe .\artifacts\package\iPhoneUsbShare.exe
          Copy-Item .\README.md .\artifacts\package\README.txt
          Set-Content .\artifacts\package\THIRD_PARTY_NOTICES.txt "libusb-win32 1.4.0.2`nApple Mobile Device Ethernet driver (netaapl64.sys/INF/CAT, WDF coinstaller)"
          Compress-Archive -Path .\artifacts\package\* -DestinationPath .\artifacts\iPhoneUsbShare-win-x64.zip -Force

      - name: Upload ready-to-run Windows package
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneUsbShare-win-x64
          path: artifacts/iPhoneUsbShare-win-x64.zip
          if-no-files-found: error
          retention-days: 14
