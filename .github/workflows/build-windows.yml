name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Acquire Windows Driver Kit tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wdkVersion = '10.0.26100.6584'
          $nupkgUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$($wdkVersion.ToLowerInvariant())/microsoft.windows.wdk.x64.$($wdkVersion.ToLowerInvariant()).nupkg"
          $wdkRoot = Join-Path $env:RUNNER_TEMP 'wdk'
          $nupkg = Join-Path $env:RUNNER_TEMP 'wdk.nupkg'
          if (Test-Path $wdkRoot) { Remove-Item $wdkRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $wdkRoot | Out-Null
          Write-Host "Downloading Microsoft WDK $wdkVersion from NuGet..."
          Invoke-WebRequest -Uri $nupkgUrl -OutFile $nupkg
          Expand-Archive -Path $nupkg -DestinationPath $wdkRoot -Force
          $inf2cat = Get-ChildItem $wdkRoot -Filter Inf2Cat.exe -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $inf2cat) {
            throw "Inf2Cat.exe was not found in Microsoft.Windows.WDK.x64 $wdkVersion."
          }
          Write-Host "Using Inf2Cat: $($inf2cat.FullName)"
          "INF2CAT=$($inf2cat.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $inf2cat.FullName /? | Select-Object -First 8

      - name: Generate WinUSB control catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:INF2CAT -or -not (Test-Path $env:INF2CAT)) {
            throw 'INF2CAT environment variable does not point to a valid Inf2Cat.exe.'
          }
          Write-Host "Using Inf2Cat: $env:INF2CAT"
          & $env:INF2CAT /driver:"$PWD\Driver" /os:10_VB_X64 /uselocaltime /verbose
          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path .\Driver\WinUsbControl.cat)) {
            throw 'Inf2Cat completed but WinUsbControl.cat was not generated.'
          }
          Get-Item .\Driver\WinUsbControl.cat | Select-Object FullName,Length

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish EXE
        shell: pwsh
        run: |
          dotnet restore .\src\iPhoneUsbShare.csproj
          dotnet publish .\src\iPhoneUsbShare.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o .\artifacts\publish

      - name: Package ready-to-run ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = '.\artifacts\package'
          $driver = Join-Path $package 'Driver'
          New-Item -ItemType Directory -Force $driver | Out-Null
          Copy-Item .\artifacts\publish\iPhoneUsbShare.exe $package\iPhoneUsbShare.exe -Force
          Copy-Item .\README.md $package\README.txt -Force
          Copy-Item .\Driver\WinUsbControl.inf $driver\WinUsbControl.inf -Force
          Copy-Item .\Driver\WinUsbControl.cat $driver\WinUsbControl.cat -Force
          Copy-Item .\Driver\install-winusb-control.ps1 $driver\install-winusb-control.ps1 -Force
          Set-Content (Join-Path $package 'THIRD_PARTY_NOTICES.txt') 'Windows WinUSB and UsbNcm are Microsoft-provided inbox components. The WinUSB control package targets Apple USB VID_05AC/PID_12AB MI_00 and contains no Apple driver binary.'
          Compress-Archive -Path "$package\*" -DestinationPath .\artifacts\iPhoneUsbShare-win-x64.zip -Force
          Get-Item .\artifacts\iPhoneUsbShare-win-x64.zip | Select-Object FullName,Length

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneUsbShare-win-x64
          path: artifacts/iPhoneUsbShare-win-x64.zip
          if-no-files-found: error
          retention-days: 14
