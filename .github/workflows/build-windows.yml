name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish EXE
        shell: pwsh
        run: |
          dotnet restore .\src\iPhoneUsbShare.csproj
          dotnet publish .\src\iPhoneUsbShare.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o .\artifacts\publish

      - name: Package ready-to-run ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = '.\artifacts\package'
          New-Item -ItemType Directory -Force $package | Out-Null
          Copy-Item .\artifacts\publish\iPhoneUsbShare.exe $package\iPhoneUsbShare.exe -Force
          Copy-Item .\README.md $package\README.txt -Force
          Set-Content (Join-Path $package 'THIRD_PARTY_NOTICES.txt') 'Windows WinUSB and UsbNcm are Microsoft-provided inbox components.'
          Compress-Archive -Path "$package\*" -DestinationPath .\artifacts\iPhoneUsbShare-win-x64.zip -Force
          Get-Item .\artifacts\iPhoneUsbShare-win-x64.zip | Select-Object FullName,Length

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneUsbShare-win-x64
          path: artifacts/iPhoneUsbShare-win-x64.zip
          if-no-files-found: error
          retention-days: 14
