name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'src\UsbNative.cs'
          $text = Get-Content -LiteralPath $path -Raw

          # Remove legacy libusb cleanup calls and methods from the build copy.
          $text = [regex]::Replace($text, '(?m)^\s*RemoveLegacyLibUsbFilter\(parent\);\r?\n', '')
          $text = [regex]::Replace($text, '(?m)^\s*RemoveLegacyLibUsbService\(\);\r?\n', '')
          $text = [regex]::Replace($text, '(?ms)\r?\n    private static void RemoveLegacyLibUsbFilter\(string parentId\).*?(?=\r?\n    private static )', "`r`n")
          $text = [regex]::Replace($text, '(?ms)\r?\n    private static void RemoveLegacyLibUsbService\(\).*?(?=\r?\n    private static )', "`r`n")

          # Verify Apple child discovery handles REV_xxxx before MI_xx.
          $expectedDiscovery = 'id\.StartsWith\("USB\\+VID_05AC&PID_",\s*StringComparison\.OrdinalIgnoreCase\)\s*&&\s*id\.Contains\(marker,\s*StringComparison\.OrdinalIgnoreCase\)'
          if (-not [regex]::IsMatch($text, $expectedDiscovery)) {
            throw 'Apple child discovery validation failed.'
          }

          if ($text -match 'RemoveLegacyLibUsb|libusb0\.sys|install-filter\.exe') {
            throw 'Legacy USB code remains after sanitization.'
          }

          # Use the compatible-driver list for the specific PDO.
          $text = $text.Replace('SPDIT_CLASSDRIVER', 'SPDIT_COMPATDRIVER')
          $text = $text.Replace('0x00000001;', '0x00000002;')

          # Pre-stage the custom INF before SetupAPI enumerates compatible drivers.
          $preStageLines = @(
            '    private static bool PreStageWinUsbControlPackage()',
            '    {',
            '        try',
            '        {',
            '            var infPath = Path.Combine(AppContext.BaseDirectory, "Driver", "WinUsbControl.inf");',
            '            if (!File.Exists(infPath)) return false;',
            '            AppendRaw($"WinUSB migration: pre-staging custom INF: {infPath}");',
            '            var result = RunAllowRestart("pnputil.exe", $"/add-driver \\\"{infPath}\\\" /install");',
            '            AppendRaw($"WinUSB migration: PnPUtil exit={result.ExitCode}, output={result.Output.Trim()}");',
            '            return result.ExitCode == 0;',
            '        }',
            '        catch (Exception ex)',
            '        {',
            '            AppendRaw($"WinUSB migration: pre-stage failed: {ex.GetType().Name}: {ex.Message}");',
            '            return false;',
            '        }',
            '    }'
          )
          $preStage = ($preStageLines -join "`r`n") + "`r`n`r`n"
          $marker = '    private static bool InstallWinUsbDriver(string instanceId)'
          if (-not $text.Contains('private static bool PreStageWinUsbControlPackage()')) {
            $text = $text.Replace($marker, $preStage + $marker)
          }

          $text = $text.Replace(
            '    private static bool InstallWinUsbDriver(string instanceId)\r\n    {\r\n',
            '    private static bool InstallWinUsbDriver(string instanceId)\r\n    {\r\n        if (!PreStageWinUsbControlPackage()) return false;\r\n')
          $text = $text.Replace(
            'installParams.DriverPath = Path.Combine(Environment.GetFolderPath(Environment.SpecialFolder.Windows), "INF", "winusb.inf");',
            'installParams.DriverPath = Path.Combine(AppContext.BaseDirectory, "Driver", "WinUsbControl.inf");')
          $text = $text.Replace(
            'if (!string.Equals(Path.GetFileName(detail ?? ""), "winusb.inf", StringComparison.OrdinalIgnoreCase)) continue;',
            'if (!string.Equals(driver.Description, "iPhoneUsbShare Apple USB Control Interface", StringComparison.OrdinalIgnoreCase)) continue;')

          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline
          Write-Host 'Build source prepared.'

      - name: Reject legacy USB filter artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanRoot = Join-Path $PWD 'src'
          $patterns = @('libusb-win32 installer', 'install-filter.exe', 'RemoveLegacyLibUsb', 'libusb0.sys')
          $hits = foreach ($file in Get-ChildItem $scanRoot -Recurse -File) {
            Select-String -Path $file.FullName -Pattern $patterns -SimpleMatch:$false -ErrorAction SilentlyContinue
          }
          if ($hits) { throw 'Legacy USB runtime/install reference detected.' }
          Write-Host 'Legacy USB filter guard passed.'

      - name: Acquire Windows Driver Kit tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wdkVersion = '10.0.26100.6584'
          $nupkgUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$($wdkVersion.ToLowerInvariant())/microsoft.windows.wdk.x64.$($wdkVersion.ToLowerInvariant()).nupkg"
          $wdkRoot = Join-Path $env:RUNNER_TEMP 'wdk'
          $nupkg = Join-Path $env:RUNNER_TEMP 'wdk.nupkg'
          if (Test-Path $wdkRoot) { Remove-Item $wdkRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $wdkRoot | Out-Null
          Invoke-WebRequest -Uri $nupkgUrl -OutFile $nupkg
          Expand-Archive -Path $nupkg -DestinationPath $wdkRoot -Force
          $inf2cat = Get-ChildItem $wdkRoot -Filter Inf2Cat.exe -Recurse -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $inf2cat) { throw 'Inf2Cat.exe was not found.' }
          "INF2CAT=$($inf2cat.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate USB driver catalogs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:INF2CAT /driver:"$PWD\Driver" /os:10_VB_X64 /uselocaltime /verbose
          if ($LASTEXITCODE -ne 0) { throw "Inf2Cat failed: $LASTEXITCODE" }
          foreach ($catalog in @('AppleUsbCompositeConfiguration.cat','WinUsbControl.cat')) {
            if (-not (Test-Path (Join-Path '.\Driver' $catalog))) { throw "Missing $catalog" }
          }

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish EXE
        shell: pwsh
        run: |
          dotnet restore .\src\iPhoneUsbShare.csproj
          dotnet publish .\src\iPhoneUsbShare.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o .\artifacts\publish

      - name: Package ready-to-run ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = '.\artifacts\package'
          $driver = Join-Path $package 'Driver'
          $shortSha = '${{ github.sha }}'.Substring(0,12)
          New-Item -ItemType Directory -Force $driver | Out-Null
          Copy-Item .\artifacts\publish\iPhoneUsbShare.exe $package\iPhoneUsbShare.exe -Force
          Copy-Item .\README.md $package\README.txt -Force
          Copy-Item .\Driver\AppleUsbCompositeConfiguration.inf $driver\AppleUsbCompositeConfiguration.inf -Force
          Copy-Item .\Driver\AppleUsbCompositeConfiguration.cat $driver\AppleUsbCompositeConfiguration.cat -Force
          Copy-Item .\Driver\WinUsbControl.inf $driver\WinUsbControl.inf -Force
          Copy-Item .\Driver\WinUsbControl.cat $driver\WinUsbControl.cat -Force
          Copy-Item .\Driver\install-winusb-control.ps1 $driver\install-winusb-control.ps1 -Force
          @(
            'iPhoneUsbShare Windows x64 package',
            "Commit: ${{ github.sha }}",
            "Short commit: $shortSha",
            "Workflow run: ${{ github.run_id }}",
            "Built: $((Get-Date).ToUniversalTime().ToString('o'))",
            'Control driver: Microsoft WinUSB on Apple USB MI_00',
            'USB composite configuration: Microsoft Usbccgp selects OriginalConfigurationValue=5',
            'USB child discovery: accepts REV_xxxx before MI_xx in Apple instance IDs',
            'WinUSB driver discovery: custom INF pre-staged with PnPUtil and enumerated with SPDIT_COMPATDRIVER',
            'Network driver: Microsoft UsbNcm inbox driver',
            'Network modes: Direct USB (isolated static IPv4 + built-in DHCP) and Reverse tethering (Windows ICS); select in the UI or with --mode=direct|reverse',
            'Legacy libusb-win32/libusb0 runtime: NOT INCLUDED'
          ) | Set-Content (Join-Path $package 'BUILD-INFO.txt') -Encoding utf8
          Set-Content (Join-Path $package 'THIRD_PARTY_NOTICES.txt') 'Windows Usbccgp, WinUSB, and UsbNcm are Microsoft-provided inbox components. The package contains configuration metadata and INF files only; it contains no Apple driver binary.'
          $zip = ".\artifacts\iPhoneUsbShare-win-x64-$shortSha.zip"
          Compress-Archive -Path "$package\*" -DestinationPath $zip -Force

      - name: Verify final payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $driver = '.\artifacts\package\Driver'
          $bad = Get-ChildItem $driver -Recurse -File | Where-Object { $_.Name -match '(?i)^(libusb0\.sys|install-filter\.exe)$' }
          if ($bad) { throw 'Legacy USB filter artifact found.' }
          $exe = '.\artifacts\package\iPhoneUsbShare.exe'
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          foreach ($pattern in @('RemoveLegacyLibUsb','libusb0.sys','install-filter.exe')) {
            if ($ascii.Contains($pattern)) { throw "Legacy symbol found: $pattern" }
          }
          Write-Host 'Final payload verification passed.'

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneUsbShare-win-x64-${{ github.sha }}
          path: artifacts/iPhoneUsbShare-win-x64-*.zip
          if-no-files-found: error
          retention-days: 14
