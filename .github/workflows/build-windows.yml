name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Verify Apple driver files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($f in @('netaapl64.inf','netaapl64.sys','netaapl64.cat','WdfCoInstaller01009.dll')) {
            $p = Join-Path 'NetDrivers' $f
            if (-not (Test-Path $p)) { throw "Missing NetDrivers file: $p" }
            Write-Host "$p : $((Get-Item $p).Length) bytes"
          }

      - name: Add Apple Ethernet diagnostics hook
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'src\ShareEngine.cs'
          $text = Get-Content $path -Raw
          $nl = [Environment]::NewLine
          $old = '            // Windows 10 has no inbox UsbNcm.sys.'
          if (-not $text.Contains($old)) { throw 'Windows 10 Ethernet comment anchor not found.' }
          $replacement = @(
            '            // Force a PnP rescan now that the iPad is in networking mode.',
            '            RescanAppleNetworkingInterfaces();',
            '',
            $old
          ) -join $nl
          $text = $text.Replace($old, $replacement, 1)
          $method = @(
            '',
            '    private void RescanAppleNetworkingInterfaces()',
            '    {',
            '        WriteLog("Forcing Windows PnP rescan for Apple networking interfaces…");',
            '        var scan = RunAllowRestart("pnputil.exe", "/scan-devices");',
            '        WriteLog($"PNPUTIL scan exit code: {scan.ExitCode}");',
            '        if (!string.IsNullOrWhiteSpace(scan.Output)) WriteLog($"PNPUTIL scan output: {scan.Output.Trim()}");',
            '        if (!string.IsNullOrWhiteSpace(scan.Error)) WriteLog($"PNPUTIL scan error: {scan.Error.Trim()}");',
            '        try',
            '        {',
            '            var apple = FindPnP("VID_05AC&PID_12AB", "");',
            '            if (apple.Count == 0) WriteLog("Apple PID 12AB PnP enumeration: no matching interfaces found after scan.");',
            '            foreach (var d in apple)',
            '            {',
            '                WriteLog($"Apple interface: {d.Id} | {d.Name}");',
            '                if (d.Id.Contains("&MI_02\\", StringComparison.OrdinalIgnoreCase))',
            '                {',
            '                    WriteLog("Apple MI_02 networking interface detected; applying bundled Apple Ethernet INF.");',
            '                    var inf = Path.Combine(AppDir, "netaapl64.inf");',
            '                    var install = RunAllowRestart("pnputil.exe", $"/add-driver \\"{inf}\\" /install");',
            '                    WriteLog($"MI_02 driver install exit code: {install.ExitCode}");',
            '                    if (!string.IsNullOrWhiteSpace(install.Output)) WriteLog($"MI_02 driver install output: {install.Output.Trim()}");',
            '                    if (!string.IsNullOrWhiteSpace(install.Error)) WriteLog($"MI_02 driver install error: {install.Error.Trim()}");',
            '                }',
            '            }',
            '        }',
            '        catch (Exception ex) { WriteLog($"Apple networking PnP enumeration failed: {ex.Message}"); }',
            '    }',
            ''
          ) -join $nl
          $anchor = '    private void ConfigureUsbDevice(PnpDevice phone)'
          if (-not $text.Contains($anchor)) { throw 'ConfigureUsbDevice anchor not found.' }
          $text = $text.Replace($anchor, $method + $anchor, 1)
          Set-Content -Path $path -Value $text -Encoding utf8 -NoNewline
          Write-Host 'Apple MI_02 PnP rescan/diagnostic hook inserted.'

      - name: Publish EXE
        shell: pwsh
        run: |
          dotnet restore .\src\iPhoneUsbShare.csproj
          dotnet publish .\src\iPhoneUsbShare.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o .\artifacts\publish

      - name: Download official libusb-win32 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.2/libusb-win32-bin-1.4.0.2.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'libusb-win32.zip'
          $expected = '00004c92cdb99be36e17fb2377165eb97e63b48ba895bfc04a642ea9c3e26d94'
          Invoke-WebRequest -Uri $url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'libusb-win32 SHA-256 mismatch.' }
          $extract = Join-Path $env:RUNNER_TEMP 'libusb-win32'
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $dll = Join-Path $extract 'libusb-win32-bin-1.4.0.2\bin\amd64\libusb0.dll'
          if (-not (Test-Path $dll)) { throw 'x64 libusb0.dll not found.' }
          New-Item -ItemType Directory -Force .\artifacts\package | Out-Null
          Copy-Item $dll .\artifacts\package\libusb0.dll -Force

      - name: Package ready-to-run ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = '.\artifacts\package'
          Copy-Item .\artifacts\publish\iPhoneUsbShare.exe $package\iPhoneUsbShare.exe -Force
          Copy-Item .\README.md $package\README.txt -Force
          foreach ($f in @('netaapl64.inf','netaapl64.sys','netaapl64.cat','WdfCoInstaller01009.dll')) {
            Copy-Item (Join-Path 'NetDrivers' $f) (Join-Path $package $f) -Force
          }
          Set-Content (Join-Path $package 'THIRD_PARTY_NOTICES.txt') 'libusb-win32 1.4.0.2`r`nApple Mobile Device Ethernet driver files from NetDrivers'
          Compress-Archive -Path "$package\*" -DestinationPath .\artifacts\iPhoneUsbShare-win-x64.zip -Force
          Get-Item .\artifacts\iPhoneUsbShare-win-x64.zip | Select-Object FullName,Length

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneUsbShare-win-x64
          path: artifacts/iPhoneUsbShare-win-x64.zip
          if-no-files-found: error
          retention-days: 14
