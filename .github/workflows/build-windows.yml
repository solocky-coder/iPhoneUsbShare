name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject legacy USB filter installer artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scanRoot = Join-Path $PWD 'src'
          $patterns = @('libusb-win32 installer', 'install-filter.exe')
          $files = Get-ChildItem $scanRoot -Recurse -File
          $hits = foreach ($file in $files) {
            Select-String -Path $file.FullName -Pattern $patterns -SimpleMatch:$false -ErrorAction SilentlyContinue
          }
          if ($hits) {
            $hits | ForEach-Object { Write-Host "FORBIDDEN LEGACY INSTALLER REFERENCE: $($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'Legacy libusb filter installer reference detected in application sources.'
          }
          $legacyNames = Get-ChildItem . -Recurse -File |
            Where-Object { $_.FullName -notmatch '\\.git\\' -and $_.Name -match '(?i)^(libusb0\.sys|install-filter\.exe)$' }
          if ($legacyNames) {
            $legacyNames | ForEach-Object { Write-Host "FORBIDDEN LEGACY DRIVER FILE: $($_.FullName)" }
            throw 'Legacy USB filter binary/installer detected in repository.'
          }
          Write-Host 'Legacy USB filter installer guard passed.'

      - name: Acquire Windows Driver Kit tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wdkVersion = '10.0.26100.6584'
          $nupkgUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/$($wdkVersion.ToLowerInvariant())/microsoft.windows.wdk.x64.$($wdkVersion.ToLowerInvariant()).nupkg"
          $wdkRoot = Join-Path $env:RUNNER_TEMP 'wdk'
          $nupkg = Join-Path $env:RUNNER_TEMP 'wdk.nupkg'
          if (Test-Path $wdkRoot) { Remove-Item $wdkRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $wdkRoot | Out-Null
          Write-Host "Downloading Microsoft WDK $wdkVersion from NuGet..."
          Invoke-WebRequest -Uri $nupkgUrl -OutFile $nupkg
          Expand-Archive -Path $nupkg -DestinationPath $wdkRoot -Force
          $inf2cat = Get-ChildItem $wdkRoot -Filter Inf2Cat.exe -Recurse -File -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $inf2cat) {
            throw "Inf2Cat.exe was not found in Microsoft.Windows.WDK.x64 $wdkVersion."
          }
          Write-Host "Using Inf2Cat: $($inf2cat.FullName)"
          "INF2CAT=$($inf2cat.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $inf2cat.FullName /? | Select-Object -First 8

      - name: Generate WinUSB control catalog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:INF2CAT -or -not (Test-Path $env:INF2CAT)) {
            throw 'INF2CAT environment variable does not point to a valid Inf2Cat.exe.'
          }
          Write-Host "Using Inf2Cat: $env:INF2CAT"
          & $env:INF2CAT /driver:"$PWD\Driver" /os:10_VB_X64 /uselocaltime /verbose
          if ($LASTEXITCODE -ne 0) {
            throw "Inf2Cat failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path .\Driver\WinUsbControl.cat)) {
            throw 'Inf2Cat completed but WinUsbControl.cat was not generated.'
          }
          Get-Item .\Driver\WinUsbControl.cat | Select-Object FullName,Length

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Publish EXE
        shell: pwsh
        run: |
          dotnet restore .\src\iPhoneUsbShare.csproj
          dotnet publish .\src\iPhoneUsbShare.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o .\artifacts\publish

      - name: Package ready-to-run ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = '.\artifacts\package'
          $driver = Join-Path $package 'Driver'
          $shortSha = '${{ github.sha }}'.Substring(0,12)
          New-Item -ItemType Directory -Force $driver | Out-Null
          Copy-Item .\artifacts\publish\iPhoneUsbShare.exe $package\iPhoneUsbShare.exe -Force
          Copy-Item .\README.md $package\README.txt -Force
          Copy-Item .\Driver\WinUsbControl.inf $driver\WinUsbControl.inf -Force
          Copy-Item .\Driver\WinUsbControl.cat $driver\WinUsbControl.cat -Force
          Copy-Item .\Driver\install-winusb-control.ps1 $driver\install-winusb-control.ps1 -Force
          @(
            'iPhoneUsbShare Windows x64 package',
            "Commit: ${{ github.sha }}",
            "Short commit: $shortSha",
            "Workflow run: ${{ github.run_id }}",
            "Built: $((Get-Date).ToUniversalTime().ToString('o'))",
            'Control driver: Microsoft WinUSB on Apple USB MI_00',
            'Network driver: Microsoft UsbNcm inbox driver',
            'Legacy libusb-win32/libusb0 runtime: NOT INCLUDED'
          ) | Set-Content (Join-Path $package 'BUILD-INFO.txt') -Encoding utf8
          Set-Content (Join-Path $package 'THIRD_PARTY_NOTICES.txt') 'Windows WinUSB and UsbNcm are Microsoft-provided inbox components. The WinUSB control package targets Apple USB VID_05AC/PID_12AB MI_00 and contains no Apple driver binary.'
          $zip = ".\\artifacts\\iPhoneUsbShare-win-x64-$shortSha.zip"
          Compress-Archive -Path "$package\*" -DestinationPath $zip -Force
          Get-Item $zip | Select-Object FullName,Length

      - name: Verify package contains no legacy USB filter installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = '.\artifacts\package'
          $forbidden = Get-ChildItem $package -Recurse -File |
            Where-Object { $_.Name -match '(?i)^(libusb0\.sys|install-filter\.exe)$' }
          if ($forbidden) {
            $forbidden | ForEach-Object { Write-Host "FORBIDDEN PACKAGE FILE: $($_.FullName)" }
            throw 'Legacy USB filter artifact entered the Windows package.'
          }
          $textHits = Get-ChildItem $package -Recurse -File |
            Where-Object { $_.Extension -in @('.txt','.ps1','.inf') } |
            ForEach-Object { Select-String -Path $_.FullName -Pattern 'libusb-win32 installer|install-filter\.exe' -ErrorAction SilentlyContinue }
          if ($textHits) {
            $textHits | ForEach-Object { Write-Host "FORBIDDEN PACKAGE REFERENCE: $($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw 'Legacy USB filter installer reference entered the Windows package.'
          }
          Write-Host 'Final package legacy-installer verification passed.'

      - name: Upload ready-to-run package
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneUsbShare-win-x64-${{ github.sha }}
          path: artifacts/iPhoneUsbShare-win-x64-*.zip
          if-no-files-found: error
          retention-days: 14
