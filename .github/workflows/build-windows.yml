name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Install matching Windows 11 22H2 WDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wdk = Join-Path $env:RUNNER_TEMP "wdksetup-22621.exe"
          Write-Host "Downloading Microsoft WDK 22621..."
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196230" -OutFile $wdk
          if (-not (Test-Path $wdk)) { throw "WDK installer download failed." }
          $p = Start-Process -FilePath $wdk -ArgumentList "/features OptionId.WindowsDriverKitComplete /q /norestart" -Wait -PassThru
          if ($p.ExitCode -notin @(0,3010)) { throw "WDK installer failed with exit code $($p.ExitCode)." }
          $wdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $wdkBuild = Join-Path $wdkRoot "build\10.0.22621.0"
          $wdkInclude = Join-Path $wdkRoot "Include\10.0.22621.0"
          if (-not (Test-Path $wdkBuild)) { throw "Matching WDK 10.0.22621.0 was not installed." }
          if (-not (Test-Path $wdkInclude)) { throw "Matching WDK headers 10.0.22621.0 were not installed." }
          Write-Host "Installed matching WDK 22621 successfully."

      - name: Fix WDK 22621 MSBuild task compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kitRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $versionedBin = Join-Path $kitRoot "build\10.0.22621.0\bin"
          $buildRoot = Join-Path $kitRoot "build"
          New-Item -ItemType Directory -Force $versionedBin | Out-Null

          # First look for the exact task. Some WDK/Visual Studio combinations
          # already install the 17.0 task and need no 16->17 workaround.
          $task17 = Join-Path $versionedBin "Microsoft.DriverKit.Build.Tasks.17.0.dll"
          $task17Candidates = @()
          $task17Candidates += Get-ChildItem -Path $buildRoot -Filter "Microsoft.DriverKit.Build.Tasks.17.0.dll" -Recurse -File -ErrorAction SilentlyContinue
          $existing17 = $task17Candidates | Select-Object -First 1
          if ($existing17) {
            if ($existing17.FullName -ne $task17) {
              Copy-Item $existing17.FullName $task17 -Force
            }
            Write-Host "Using existing WDK 17.0 MSBuild task: $($existing17.FullName)"
          }
          else {
            # Older WDK 22621 installations are known to ship only the 16.0 task;
            # Microsoft Q&A documents copying it to the 17.0 filename.
            $existing16 = Get-ChildItem -Path $buildRoot -Filter "Microsoft.DriverKit.Build.Tasks.16.0.dll" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $existing16) {
              throw "WDK 22621 contains neither Microsoft.DriverKit.Build.Tasks.17.0.dll nor Microsoft.DriverKit.Build.Tasks.16.0.dll."
            }
            Copy-Item $existing16.FullName $task17 -Force
            Write-Host "Created 17.0 compatibility task from: $($existing16.FullName)"
          }
          if (-not (Test-Path $task17)) { throw "Required WDK MSBuild task was not installed at $task17" }

          # Package-verifier tasks can have the same version-name mismatch.
          $pv17 = Join-Path $versionedBin "Microsoft.DriverKit.PackageVerifier.dll"
          $pvCandidates = Get-ChildItem -Path $buildRoot -Filter "Microsoft.DriverKit.PackageVerifier.dll" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($pvCandidates -and -not (Test-Path $pv17)) {
            Copy-Item $pvCandidates.FullName $pv17 -Force
          }

      - name: Build open-source Microsoft USB NCM host driver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ncm = Join-Path $env:RUNNER_TEMP "NCM-Driver-for-Windows"
          git clone --depth 1 --branch release_21H2 --recurse-submodules https://github.com/microsoft/NCM-Driver-for-Windows.git $ncm
          if (-not (Test-Path (Join-Path $ncm 'dmf'))) { throw 'DMF submodule was not populated.' }

          $inf = Join-Path $ncm "host\UsbNcmSample.inf"
          if (-not (Test-Path $inf)) { throw "Microsoft NCM host INF was not found." }
          $text = Get-Content $inf -Raw
          $needle = '; %UsbNcm.DeviceDesc%=UsbNcm_Device, USB\\Class_02&SubClass_0d&Prot_00'
          if ($text.Contains($needle)) {
            $text = $text.Replace($needle, '%UsbNcm.DeviceDesc%=UsbNcm_Device, USB\\Class_02&SubClass_0d&Prot_00')
          }
          Set-Content -Path $inf -Value $text -Encoding utf8 -NoNewline

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found." }
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio installation not found." }
          $msbuild = Join-Path $vs "MSBuild\Current\Bin\MSBuild.exe"
          if (-not (Test-Path $msbuild)) { throw "MSBuild.exe not found at $msbuild" }

          $sdk = '10.0.22621.0'
          $kitRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          $sdkInclude = Join-Path $kitRoot "Include\$sdk"
          $sdkLib = Join-Path $kitRoot "Lib\$sdk"
          $wdkBuild = Join-Path $kitRoot "build\$sdk"
          if (-not (Test-Path $sdkInclude)) { throw "Windows SDK $sdk is not installed on this runner." }
          if (-not (Test-Path $sdkLib)) { throw "Windows SDK libraries $sdk are not installed on this runner." }
          if (-not (Test-Path $wdkBuild)) { throw "Windows WDK $sdk is not installed on this runner." }
          Write-Host "Using matching SDK/WDK build: $sdk"

          $solution = Join-Path $ncm "usbncm.sln"
          if (-not (Test-Path $solution)) { throw "Microsoft NCM solution was not found." }
          & $msbuild $solution /t:Build /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=$sdk /p:TreatWarningsAsErrors=false /p:EnablePREfast=false /m /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Microsoft NCM host driver solution build failed ($LASTEXITCODE)." }

          $driverRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\ncm-driver"
          New-Item -ItemType Directory -Force $driverRoot | Out-Null
          $sys = Get-ChildItem -Path $ncm -Filter UsbNcmSample.sys -Recurse | Where-Object { $_.FullName -match '\\Release\\x64\\' } | Select-Object -First 1
          if (-not $sys) { $sys = Get-ChildItem -Path $ncm -Filter UsbNcmSample.sys -Recurse | Select-Object -First 1 }
          if (-not $sys) { throw "UsbNcmSample.sys was not produced." }
          Copy-Item $sys.FullName (Join-Path $driverRoot "UsbNcmSample.sys") -Force
          Copy-Item $inf (Join-Path $driverRoot "UsbNcmSample.inf") -Force
          if (Test-Path (Join-Path $ncm "LICENSE")) { Copy-Item (Join-Path $ncm "LICENSE") (Join-Path $driverRoot "MICROSOFT-NCM-LICENSE.txt") -Force }
          Set-Content (Join-Path $driverRoot "README.txt") @"
          Experimental Microsoft USB NCM host driver

          Source: https://github.com/microsoft/NCM-Driver-for-Windows
          Branch: release_21H2
          License: MIT

          The generic CDC-NCM hardware match is enabled for Apple's NCM interface.
          This is an engineering/test driver. Microsoft documents that Windows 10 does
          not ship the inbox UsbNcm.sys driver; normal Windows 10 kernel-driver policy
          also requires an appropriately signed driver package for ordinary deployment.
          "@
          Compress-Archive -Path "$driverRoot\*" -DestinationPath "$driverRoot\Microsoft-UsbNcm-Host-x64-experimental.zip" -Force

      - name: Publish self-contained EXE
        shell: pwsh
        run: |
          dotnet restore .\src\iPhoneUsbShare.csproj
          dotnet publish .\src\iPhoneUsbShare.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -o .\artifacts\publish

      - name: Prepare libusb-win32 runtime DLL
        shell: pwsh
        run: |
          $url = "https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.2/libusb-win32-bin-1.4.0.2.zip"
          $zip = Join-Path $env:RUNNER_TEMP "libusb-win32-bin-1.4.0.2.zip"
          $expected = "00004c92cdb99be36e17fb2377165eb97e63b48ba895bfc04a642ea9c3e26d94"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "libusb-win32 SHA-256 mismatch. Expected $expected, got $actual" }
          $extract = Join-Path $env:RUNNER_TEMP "libusb-win32"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $dll = Join-Path $extract "libusb-win32-bin-1.4.0.2\bin\amd64\libusb0.dll"
          if (-not (Test-Path $dll)) { throw "x64 libusb0.dll was not found in the official libusb-win32 package." }
          New-Item -ItemType Directory -Force .\artifacts\package | Out-Null
          Copy-Item $dll .\artifacts\package\libusb0.dll -Force

      - name: Create user package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\artifacts\package | Out-Null
          Copy-Item .\artifacts\publish\iPhoneUsbShare.exe .\artifacts\package\iPhoneUsbShare.exe
          Copy-Item .\README.md .\artifacts\package\README.txt
          Set-Content .\artifacts\package\THIRD_PARTY_NOTICES.txt @"
          libusb-win32 1.4.0.2
          Copyright and license information: https://github.com/mcuee/libusb-win32
          The libusb-win32 user-space library (libusb0.dll) is distributed under the LGPL.
          The application downloads the matching signed libusb-win32 driver package on first setup and verifies its SHA-256 hash.

          Microsoft NCM-Driver-for-Windows
          Source: https://github.com/microsoft/NCM-Driver-for-Windows
          License: MIT
          An experimental x64 host-driver build is provided separately by the workflow.
          "@
          Compress-Archive -Path .\artifacts\package\* -DestinationPath .\artifacts\iPhoneUsbShare-win-x64.zip -Force

      - name: Upload ready-to-run Windows package
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneUsbShare-win-x64
          path: artifacts/iPhoneUsbShare-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload experimental Microsoft NCM driver
        uses: actions/upload-artifact@v4
        with:
          name: Microsoft-UsbNcm-Host-x64-experimental
          path: artifacts/ncm-driver/Microsoft-UsbNcm-Host-x64-experimental.zip
          if-no-files-found: error
          retention-days: 14
