name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply iPad Air 2 CDC-NCM mode 5 fix
        shell: pwsh
        run: |
          $path = ".\src\ShareEngine.cs"
          $text = Get-Content $path -Raw
          $old = @'
            WriteLog($"Apple USB mode: {mode}");
            if (mode != "3:3:3:0" && mode != "3:3:3") throw new InvalidOperationException($"Unexpected Apple USB mode: {mode}.");
            SetConfig(phone.Id, NcmIndexValue, SafeIndexValue);
            WriteLog("Set Apple USB configuration to CDC-NCM mode (4).");
            var accepted = await UsbNative.SetModeAsync(3);
            WriteLog($"SET_MODE(3) result: {(accepted ? "accepted" : "rejected/failed")}");
            if (!accepted) { SetConfig(phone.Id, SafeIndexValue, "0"); throw new InvalidOperationException("The Apple device rejected the CDC-NCM mode switch. Unplug/replug and try again."); }
            WriteLog("Apple device accepted CDC-NCM mode; waiting for USB Ethernet…");
'@
          $new = @'
            WriteLog($"Apple USB mode: {mode}");
            if (mode == "5:3:3:0" || mode == "5:3:3")
            {
                // iPad Air 2 can enter usbmuxd CDC-NCM direct mode 5. In this mode
                // the device exposes one configuration directly; configuration 4
                // from the iPhone path does not exist and must NOT be selected.
                WriteLog("iPad is already in CDC-NCM direct mode (5); skipping configuration 4 and SET_MODE.");
            }
            else
            {
                if (mode != "3:3:3:0" && mode != "3:3:3") throw new InvalidOperationException($"Unexpected Apple USB mode: {mode}.");
                SetConfig(phone.Id, NcmIndexValue, SafeIndexValue);
                WriteLog("Set Apple USB configuration to CDC-NCM mode (4).");
                var accepted = await UsbNative.SetModeAsync(3);
                WriteLog($"SET_MODE(3) result: {(accepted ? "accepted" : "rejected/failed")}");
                if (!accepted) { SetConfig(phone.Id, SafeIndexValue, "0"); throw new InvalidOperationException("The Apple device rejected the CDC-NCM mode switch. Unplug/replug and try again."); }
                WriteLog("Apple device accepted CDC-NCM mode; waiting for USB Ethernet…");
            }
'@
          if (-not $text.Contains($old)) { throw "Expected ShareEngine mode-switch block was not found." }
          Set-Content -Path $path -Value $text.Replace($old,$new) -Encoding UTF8

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Publish self-contained EXE
        shell: pwsh
        run: |
          dotnet restore .\src\iPhoneUsbShare.csproj
          dotnet publish .\src\iPhoneUsbShare.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -o .\artifacts\publish

      - name: Prepare libusb-win32 runtime DLL
        shell: pwsh
        run: |
          $url = "https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.2/libusb-win32-bin-1.4.0.2.zip"
          $zip = Join-Path $env:RUNNER_TEMP "libusb-win32-bin-1.4.0.2.zip"
          $expected = "00004c92cdb99be36e17fb2377165eb97e63b48ba895bfc04a642ea9c3e26d94"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "libusb-win32 SHA-256 mismatch. Expected $expected, got $actual" }
          $extract = Join-Path $env:RUNNER_TEMP "libusb-win32"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $dll = Join-Path $extract "libusb-win32-bin-1.4.0.2\bin\amd64\libusb0.dll"
          if (-not (Test-Path $dll)) { throw "x64 libusb0.dll was not found in the official libusb-win32 package." }
          New-Item -ItemType Directory -Force .\artifacts\package | Out-Null
          Copy-Item $dll .\artifacts\package\libusb0.dll -Force

      - name: Create user package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .\artifacts\package | Out-Null
          Copy-Item .\artifacts\publish\iPhoneUsbShare.exe .\artifacts\package\iPhoneUsbShare.exe
          Copy-Item .\README.md .\artifacts\package\README.txt
          Set-Content .\artifacts\package\THIRD_PARTY_NOTICES.txt @"
          libusb-win32 1.4.0.2
          Copyright and license information: https://github.com/mcuee/libusb-win32
          The libusb-win32 user-space library (libusb0.dll) is distributed under the LGPL.
          The application downloads the matching signed libusb-win32 driver package on first setup and verifies its SHA-256 hash.
          "@
          Compress-Archive -Path .\artifacts\package\* -DestinationPath .\artifacts\iPhoneUsbShare-win-x64.zip -Force

      - name: Upload ready-to-run Windows package
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneUsbShare-win-x64
          path: artifacts/iPhoneUsbShare-win-x64.zip
          if-no-files-found: error
          retention-days: 14
