name: Build AppleNcm.sys

on:
  workflow_dispatch:
  push:
    paths:
      - 'Driver/**'
      - '.github/workflows/build-apple-ncm-driver.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build AppleNcm.sys
        shell: pwsh
        run: ./Driver/build-driver.ps1
      - name: Upload AppleNcm package
        uses: actions/upload-artifact@v4
        with:
          name: AppleNcm-win10-x64-dev
          path: artifacts/AppleNcm
